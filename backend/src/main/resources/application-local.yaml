spring:
  datasource:
    url: jdbc:mysql://localhost:3306/football_club
    username: dev_user
    password: ${DB_PASSWORD}

logging:
  file:
    name: logs/football-club.log

  level:
    root: INFO
    com.thienpm.footballclub: DEBUG

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB